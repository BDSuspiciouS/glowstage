<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1013">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Glowstage">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" id="manifest">
<link rel="apple-touch-icon" id="touch-icon">
<link rel="icon" id="favicon">
<title>Glowstage</title>
<style>
  :root {
    --bg: #0f1013; --card: #17181c; --card-2: #1e1f24; --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14);
    --text: #f3f1ed; --muted: #9c9ca5; --primary: #f3f1ed; --primary-ink: #141418; --danger: #ff6b5b;
    --f: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 var(--f); }
  main { max-width: 520px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .power {
    width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--card-2);
    color: var(--muted); display: grid; place-items: center; cursor: pointer; transition: background .2s, color .2s, transform .1s;
  }
  .power svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .power.is-on { background: var(--primary); color: var(--primary-ink); border-color: transparent; }
  .power:active, .btn:active, .preset:active, .chip:active { transform: scale(.97); }  section { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 12px; letter-spacing: .02em; }
  .row { display: flex; align-items: center; gap: 14px; }
  input[type=range] { flex: 1; accent-color: var(--text); height: 32px; }
  .num { font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; color: var(--muted); }
  .presets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .preset {
    position: relative; height: 78px; border-radius: 14px; border: 0; padding: 10px 12px; overflow: hidden; cursor: pointer;
    display: flex; align-items: flex-end; color: #fff; font: 600 14px var(--f); text-align: left; background: #26272d;
  }
  .preset span { position: relative; text-shadow: 0 1px 6px rgba(0,0,0,.55); }
  .preset::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.45)); }
  .preset.is-active { outline: 2px solid var(--text); outline-offset: 2px; }
  .btn {
    width: 100%; min-height: 48px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--card-2);
    color: var(--text); font: 600 15px var(--f); cursor: pointer;
  }
  .btn.is-on { background: var(--primary); color: var(--primary-ink); border-color: transparent; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { flex: 1 1 0; min-height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--card-2); color: var(--text); font: 500 14px var(--f); cursor: pointer; }
  .sleep-on { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .banner { display: none; background: rgba(255,107,91,.12); color: #ffb3aa; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; }
  .banner.show { display: block; }
  .item { padding: 10px 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; padding-top: 0; }
  .item:last-child { padding-bottom: 0; }
  .item-top { display: flex; align-items: center; gap: 12px; min-height: 48px; }
  .dot { flex: none; width: 18px; height: 18px; border-radius: 50%; background: #3a3b44; border: 1px solid var(--line-2); }
  .name { flex: 1; min-width: 0; font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note { color: var(--danger); font-size: 13.5px; font-weight: 500; }
  .switch {
    flex: none; position: relative; width: 56px; height: 44px; border: 0; padding: 0; background: none; cursor: pointer;
  }
  .switch::before {
    content: ""; position: absolute; left: 0; top: 7px; width: 56px; height: 30px; border-radius: 15px;
    background: var(--card-2); border: 1px solid var(--line-2); transition: background .2s;
  }
  .switch::after {
    content: ""; position: absolute; left: 4px; top: 11px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--muted); transition: transform .2s, background .2s;
  }
  .switch[aria-checked=true]::before { background: var(--primary); border-color: transparent; }
  .switch[aria-checked=true]::after { background: var(--primary-ink); transform: translateX(26px); }
  .switch:disabled, input[type=range]:disabled { opacity: .4; cursor: default; }
  .item .row { gap: 12px; }
  .hint { color: var(--muted); font-size: 14px; margin: -4px 0 12px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .swatches { display: flex; height: 44px; border-radius: 12px; overflow: hidden; margin: 14px 0 12px; }
  .swatches span { flex: 1; }
  .colors { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  .color { height: 44px; padding: 0; border-radius: 12px; border: 1px solid var(--line-2); cursor: pointer; }
  .color:active { transform: scale(.97); }
  .color[aria-pressed=true] { outline: 2px solid var(--text); outline-offset: 2px; }
  .more { margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .more .dot { width: 16px; height: 16px; }
  .pick { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .looks { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .looks .preset { height: 64px; padding: 8px 10px; font-size: 13px; line-height: 1.2; }
  .focus-label { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
  .save-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .save-row input {
    flex: 1 1 100%; min-width: 0; min-height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--card-2);
    color: var(--text); font: 15px var(--f); padding: 0 12px;
  }
  .done { color: var(--muted); font-size: 14px; margin-top: 10px; min-height: 1.4em; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Glowstage</h1><div class="sub" id="sub">Connecting…</div></div>
    <button class="power" id="power" type="button" aria-label="All lights on or off">
      <svg viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M6.6 6.9a7.5 7.5 0 1 0 10.8 0"/></svg>
    </button>
  </header>
  <div class="banner" id="banner" role="alert"></div>
  <section>
    <h2>Brightness</h2>
    <div class="row"><input type="range" id="bright" min="1" max="100" aria-label="Brightness"><span class="num" id="bright-val"></span></div>
  </section>
  <section>
    <h2>Presets</h2>
    <div class="presets" id="presets"></div>
  </section>
  <section>
    <h2>Color</h2>
    <div class="colors" id="colors"></div>
    <button class="btn more" id="more-colors" type="button"><span class="dot" id="more-dot" hidden></span>More colors</button>
    <input type="color" class="pick" id="pick" value="#ffb46b" aria-label="Choose a color" tabindex="-1">
  </section>
  <section>
    <h2>Looks</h2>
    <div class="presets looks" id="looks"></div>
  </section>
  <section>
    <h2>From a photo</h2>
    <p class="hint">Take a photo of a sunset, a poster or a plant, or pick one, and your lights take its colors.</p>
    <button class="btn" id="photo-btn" type="button">Take or pick a photo</button>
    <input type="file" id="photo" accept="image/*" hidden>
    <div id="photo-done" hidden>
      <div class="swatches" id="swatches" role="img" aria-label="The photo's colors"></div>
      <div class="save-row">
        <input type="text" id="photo-name" maxlength="40" aria-label="Preset name" autocomplete="off">
        <button class="chip" id="photo-save" type="button">Save as preset</button>
        <button class="chip" id="photo-undo" type="button">Undo</button>
      </div>
      <div class="done" id="photo-note" aria-live="polite"></div>
    </div>
  </section>
  <section>
    <button class="btn" id="show" type="button">Start the light show</button>
  </section>
  <section>
    <h2>Focus timer</h2>
    <div id="focus-off">
      <p class="hint" id="focus-last"></p>
      <button class="btn" id="focus-start" type="button">Start the focus timer</button>
    </div>
    <div id="focus-on" hidden>
      <div class="focus-label" id="focus-label"></div>
      <p class="hint" id="focus-text"></p>
      <div class="chips">
        <button class="chip" id="focus-skip" type="button">Skip</button>
        <button class="chip" id="focus-stop" type="button">Stop</button>
      </div>
    </div>
  </section>
  <section>
    <h2>Sleep timer</h2>
    <div id="sleep"></div>
  </section>
  <section id="groups-box" hidden><div id="groups"></div></section>
  <section id="lights-box" hidden>
    <h2>Lights</h2>
    <div id="lights"></div>
  </section>
</main>
<script>
"use strict";
const key = new URLSearchParams(location.search).get("k") || "";
// "Add to home screen": the name, the icon and opening full screen come from the PC (they need the key too)
for (const [id, href] of [["manifest", "/manifest.webmanifest"], ["touch-icon", "/icon.png?s=180"], ["favicon", "/icon.png?s=192"]])
  document.getElementById(id).href = href + (href.includes("?") ? "&" : "?") + "k=" + encodeURIComponent(key);
const $ = id => document.getElementById(id);
let state = null, busyUntil = 0, dragging = false;
const rows = {};                                  // the group and light rows, by "group:pc" / "light:id"

const PALETTES = {
  rainbow: ["#ff3b5c", "#ffb03b", "#3bff8a", "#3bc8ff", "#8a5bff"], spectrum: ["#ff3b5c", "#3bff8a", "#3bc8ff", "#ff3bd2"],
  music_party: ["#ff2f92", "#ffb03b", "#3bc8ff", "#8a5bff"], music_show: ["#00e5ff", "#ff00c8", "#2a4bff", "#ff0040"],
  music_ripple: ["#2b6bff", "#00e5ff", "#ff2f92"], screen: ["#3a6bff", "#ff8a3a", "#2bd3c4"], screen_sound: ["#fff0dc", "#3a6bff", "#ff8a3a"],
  fire: ["#ffd25a", "#ff5a00", "#8a1500"], aurora: ["#2bff9a", "#2bd3ff", "#8a4bff"], daylight: ["#ffe6cc", "#ff8a3a", "#ffc27a"],
};
function art(p) {
  if (p.off) return "linear-gradient(135deg, #24252b, #141418)";
  const fx = (p.effects || []).find(e => PALETTES[e]);
  const c = fx ? PALETTES[fx] : (p.colors || []);
  if (!c.length) return "linear-gradient(135deg, #3a3b44, #1a1b20)";
  if (c.length === 1) return `radial-gradient(120% 130% at 20% 0%, ${c[0]}, ${c[0]} 45%, #111 140%)`;
  return `radial-gradient(90% 110% at 0% 0%, ${c[0]} 0%, transparent 70%), radial-gradient(90% 110% at 100% 10%, ${c[1]} 0%, transparent 70%),`
    + ` radial-gradient(90% 110% at 30% 110%, ${c[2 % c.length]} 0%, transparent 70%), linear-gradient(135deg, #222, #111)`;
}
// The quick colors (the same ones as in the window's color panel).
const COLORS = [
  ["Warm white", "#ffb46b"], ["Cool white", "#f2f5ff"], ["Red", "#ff1a1a"], ["Amber", "#ff7a00"], ["Green", "#00e05a"],
  ["Cyan", "#00c8ff"], ["Blue", "#1f4bff"], ["Violet", "#7c3dff"], ["Magenta", "#ff00c8"], ["Pink", "#ff5c8a"],
];
const clock = s => new Date(s * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

async function api(path, body) {
  const r = await fetch(`${path}?k=${encodeURIComponent(key)}`, body
    ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await r.json().catch(() => ({}));
  if (r.status === 403) throw new Error("This link doesn't work any more: scan the code in Glowstage (Setup → Phone remote) again.");
  if (!r.ok || data.ok === false) throw new Error(data.error || "Glowstage didn't answer");
  return data;
}
function problem(text) {
  $("banner").textContent = text || "";
  $("banner").classList.toggle("show", !!text);
}
async function act(body) {
  busyUntil = Date.now() + 1500;
  try { const r = await api("/api/do", body); problem(""); render(r.state); } catch (e) { problem(e.message); }
}
async function poll() {
  if (document.hidden || Date.now() < busyUntil) return;
  try { render(await api("/api/state")); problem(""); }
  catch (e) { problem(e.message.includes("link") ? e.message : "Can't reach Glowstage. Is the PC on, and your phone on the same Wi-Fi?"); }
}

// One row: a name, a switch and a brightness slider. Built once, then only updated, so a slider
// you are dragging never jumps.
function makeRow(kind, item, label, dot) {
  const id = `${kind}:${item.id}`;
  const el = document.createElement("div");
  el.className = "item";
  const top = document.createElement("div");
  top.className = "item-top";
  const parts = [];
  let dotEl = null;
  if (dot) { dotEl = document.createElement("span"); dotEl.className = "dot"; dotEl.setAttribute("aria-hidden", "true"); parts.push(dotEl); }
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = item.name;
  const note = document.createElement("span");
  note.className = "note";
  note.textContent = "Not answering";
  note.hidden = true;
  const sw = document.createElement("button");
  sw.type = "button"; sw.className = "switch"; sw.setAttribute("role", "switch");
  sw.setAttribute("aria-label", label);
  top.append(...parts, name, note, sw);
  const line = document.createElement("div");
  line.className = "row";
  const range = document.createElement("input");
  range.type = "range"; range.min = 1; range.max = 100;
  range.setAttribute("aria-label", `Brightness, ${label}`);
  const val = document.createElement("span");
  val.className = "num";
  line.append(range, val);
  el.append(top, line);
  const r = { id, el, dotEl, note, sw, range, val, kind, key: item.id };
  sw.onclick = () => {
    const on = sw.getAttribute("aria-checked") !== "true";
    act(kind === "group" ? { do: "group", group: item.id, on } : { do: "light", id: item.id, on });
  };
  let slide;
  range.oninput = () => {
    val.textContent = `${range.value}%`;
    clearTimeout(slide);
    const value = Number(range.value);
    slide = setTimeout(() => act(kind === "group"
      ? { do: "group_brightness", group: item.id, value } : { do: "light_brightness", id: item.id, value }), 120);
  };
  for (const ev of ["pointerdown", "touchstart"]) range.addEventListener(ev, () => { dragging = true; }, { passive: true });
  for (const ev of ["pointerup", "pointercancel", "touchend", "touchcancel", "change", "blur"]) range.addEventListener(ev, () => { dragging = false; });
  rows[id] = r;
  return r;
}
function updateRow(r, item) {
  const online = item.online !== false;
  r.sw.setAttribute("aria-checked", String(!!item.on));
  r.sw.disabled = !online;
  r.range.disabled = !online || !item.on;
  r.note.hidden = online;
  if (r.dotEl) r.dotEl.style.background = online && item.on ? item.color : "";
  if (document.activeElement !== r.range && !dragging) r.range.value = item.brightness || 1;
  r.val.textContent = !online ? "" : item.on ? `${Math.round(item.brightness)}%` : "off";
}
function syncRows(box, kind, items, labelOf, dot) {
  const sig = JSON.stringify(items.map(i => [i.id, i.name]));
  if (box.dataset.sig !== sig) {
    box.dataset.sig = sig;
    for (const k of Object.keys(rows)) if (k.startsWith(kind + ":")) delete rows[k];
    box.replaceChildren(...items.map(i => makeRow(kind, i, labelOf(i), dot).el));
  }
  for (const i of items) updateRow(rows[`${kind}:${i.id}`], i);
}

function render(s) {
  state = s;
  $("sub").textContent = s.count ? `${s.on} of ${s.count} lights on` : "No lights found";
  const groups = s.groups.map(g => ({ id: g.key, name: g.name, on: g.on, brightness: g.brightness, online: true }));
  $("groups-box").hidden = !groups.length;
  $("lights-box").hidden = !s.lights.length;
  syncRows($("groups"), "group", groups, g => `${g.name} lights`, false);
  syncRows($("lights"), "light", s.lights, l => l.name, true);
  $("power").classList.toggle("is-on", s.on > 0);
  $("power").setAttribute("aria-pressed", String(s.on > 0));
  if (document.activeElement !== $("bright")) $("bright").value = s.brightness || 1;
  $("bright-val").textContent = s.on ? `${s.brightness}%` : "off";
  // The looks come from Glowstage with the colors of their tile; presets that use one are drawn in them too.
  for (const l of s.looks) if (!PALETTES[l.id]) PALETTES[l.id] = l.colors;
  const lookSig = JSON.stringify([s.looks, s.current.effect]);
  if ($("looks").dataset.sig !== lookSig) {
    $("looks").dataset.sig = lookSig;
    $("looks").replaceChildren(...s.looks.map(l => {
      const b = document.createElement("button");
      const here = l.id === s.current.effect;
      b.type = "button";
      b.className = "preset" + (here ? " is-active" : "");
      b.style.background = art({ colors: l.colors });
      b.setAttribute("aria-pressed", String(here));
      const t = document.createElement("span");
      t.textContent = l.name;
      b.append(t);
      b.onclick = () => act({ do: "effect", effect: l.id });
      return b;
    }));
  }
  for (const b of $("colors").children) b.setAttribute("aria-pressed", String(b.dataset.color === s.current.color));
  const custom = s.current.color && !COLORS.some(([, c]) => c === s.current.color);
  $("more-dot").hidden = !custom;                     // (a color of your own: shown next to "More colors")
  $("more-dot").style.background = custom ? s.current.color : "";
  const sig = JSON.stringify([s.presets, s.active]);
  if ($("presets").dataset.sig !== sig) {
    $("presets").dataset.sig = sig;
    $("presets").replaceChildren(...s.presets.map(p => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "preset" + (p.name === s.active ? " is-active" : "");
      b.style.background = art(p);
      b.setAttribute("aria-pressed", String(p.name === s.active));
      const t = document.createElement("span");
      t.textContent = p.name;
      b.append(t);
      b.onclick = () => act({ do: "preset", name: p.name });
      return b;
    }));
  }
  $("show").textContent = s.show ? "Stop the light show" : "Start the light show";
  $("show").classList.toggle("is-on", s.show);
  const running = !!s.focus.phase;
  $("focus-off").hidden = running;
  $("focus-on").hidden = !running;
  $("focus-last").textContent = s.focus.last;
  $("focus-label").textContent = s.focus.label;
  $("focus-text").textContent = s.focus.text;
  const sleep = $("sleep");
  if (s.sleep) {
    sleep.innerHTML = "";
    const row = document.createElement("div");
    row.className = "sleep-on";
    const t = document.createElement("span");
    t.textContent = `Lights off at ${clock(s.sleep.until)}`;
    const c = document.createElement("button");
    c.className = "chip"; c.type = "button"; c.style.flex = "0 0 auto"; c.style.padding = "0 16px";
    c.textContent = "Cancel";
    c.onclick = () => act({ do: "sleep", minutes: 0 });
    row.append(t, c);
    sleep.append(row);
  } else if (!sleep.querySelector(".chips")) {
    sleep.innerHTML = "";
    const chips = document.createElement("div");
    chips.className = "chips";
    for (const [m, label] of [[15, "15 min"], [30, "30 min"], [60, "1 hour"]]) {
      const c = document.createElement("button");
      c.className = "chip"; c.type = "button"; c.textContent = label;
      c.onclick = () => act({ do: "sleep", minutes: m });
      chips.append(c);
    }
    sleep.append(chips);
  }
}

// From a photo: the phone shrinks the photo itself (a few dozen KB instead of a few MB, and an
// iPhone's HEIC arrives as a JPEG), the right way up, and Glowstage takes its main colors.
function shrink(file) {
  return new Promise((done, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const f = Math.min(1, 320 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.naturalWidth * f));
      c.height = Math.max(1, Math.round(img.naturalHeight * f));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? done(b) : fail(new Error()), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error()); };
    img.src = url;
  });
}
function freeName(base) {
  const names = new Set(((state && state.presets) || []).map(p => p.name));
  if (!names.has(base)) return base;
  for (let n = 2; ; n++) if (!names.has(`${base} ${n}`)) return `${base} ${n}`;
}
$("photo-btn").onclick = () => $("photo").click();
$("photo").onchange = async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";                                // (the same photo again works too)
  if (!file) return;
  const btn = $("photo-btn");
  btn.disabled = true;
  btn.textContent = "Reading the photo…";
  busyUntil = Date.now() + 4000;
  try {
    let blob;
    try { blob = await shrink(file); }
    catch { throw new Error("Your phone couldn't open that photo. Try another one."); }
    const r = await fetch(`/api/picture?k=${encodeURIComponent(key)}`, { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob });
    const data = await r.json().catch(() => ({}));
    if (r.status === 403) throw new Error("This link doesn't work any more: scan the code in Glowstage (Setup → Phone remote) again.");
    if (!r.ok || data.ok === false) throw new Error(data.error || "Glowstage didn't answer");
    problem("");
    render(data.state);
    $("swatches").replaceChildren(...data.colors.map(c => { const s = document.createElement("span"); s.style.background = c; return s; }));
    $("photo-name").value = freeName("Phone photo");
    $("photo-note").textContent = "Your lights have the photo's colors.";
    $("photo-done").hidden = false;
  } catch (err) {
    problem(err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Take or pick a photo";
  }
};
$("photo-save").onclick = async () => {
  const name = $("photo-name").value.trim();
  busyUntil = Date.now() + 1500;
  try {
    render((await api("/api/do", { do: "save", name })).state);
    problem("");
    $("photo-note").textContent = `Saved as ${name}.`;
  } catch (e) { problem(e.message); }
};
$("photo-undo").onclick = async () => {
  await act({ do: "undo" });
  if (!$("banner").classList.contains("show")) { $("photo-done").hidden = true; }
};
$("power").onclick = () => state && act({ do: "power", on: !(state.on > 0) });
$("show").onclick = () => act({ do: "show" });
$("focus-start").onclick = () => act({ do: "focus", action: "start" });
$("focus-skip").onclick = () => act({ do: "focus", action: "skip" });
$("focus-stop").onclick = () => act({ do: "focus", action: "stop" });

// Color: the quick colors are built once; "More colors" opens the phone's own picker, and the
// color is sent when it is chosen (not on every drag over it).
for (const [name, c] of COLORS) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "color"; b.title = name; b.setAttribute("aria-label", name);
  b.dataset.color = c; b.style.background = c;
  b.onclick = () => act({ do: "color", color: c });
  $("colors").append(b);
}
$("more-colors").onclick = () => {
  const now = state && state.current.color;
  if (now) $("pick").value = now;
  $("pick").click();
};
$("pick").onchange = e => act({ do: "color", color: e.target.value });
let slide;
$("bright").oninput = e => {
  $("bright-val").textContent = `${e.target.value}%`;
  clearTimeout(slide);
  slide = setTimeout(() => act({ do: "brightness", value: Number(e.target.value) }), 120);
};
document.addEventListener("visibilitychange", poll);
poll();
setInterval(poll, 2500);
</script>
</body>
</html>
